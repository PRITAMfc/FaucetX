global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Local FaucetX backend (bun run dev in backend/, port 3001)
  - job_name: faucetx-local
    metrics_path: /api/monitoring/prometheus
    static_configs:
      - targets: ['host.docker.internal:3001']

  # Production backend on Render
  - job_name: faucetx-production
    metrics_path: /api/monitoring/prometheus
    scheme: https
    static_configs:
      - targets: ['faucetx.onrender.com']

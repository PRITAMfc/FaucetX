name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Frontend & Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run shared tests
        run: bun run test:shared

      - name: Run frontend tests
        run: bun run test:frontend

      - name: Run backend tests
        run: bun run test:backend

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

  contract:
    name: Smart Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/faucet-contract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32v1-none
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/faucet-contract

      - name: Install Stellar CLI
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-3 libudev1
          curl -fsSL -o /tmp/stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          sudo tar -xzf /tmp/stellar-cli.tar.gz -C /usr/local/bin stellar
          chmod +x /usr/local/bin/stellar
          stellar --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Build contract
        run: cargo build

      - name: Run contract tests
        run: cargo test

      - name: Clippy lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Wasm artifact (stellar contract build)
        run: stellar contract build

      - name: Verify Wasm output
        run: |
          WASM=$(find target .soroban -name "faucet_contract*.wasm" 2>/dev/null | head -n 1)
          if [ -z "$WASM" ]; then
            echo "No contract .wasm produced" && exit 1
          fi
          echo "Built contract Wasm: $WASM ($(wc -c < "$WASM") bytes)"
